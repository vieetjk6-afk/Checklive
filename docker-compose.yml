# Chạy toàn bộ Checklive: docker compose up -d --build
# Có Cloudflare Tunnel:     docker compose --profile tunnel up -d --build
# (Trên Windows: nhấp đúp windows\1-khoi-dong.bat)
# Trước khi chạy: copy .env.example thành .env và sửa JWT_SECRET, ADMIN_PASSWORD (và TUNNEL_TOKEN nếu dùng tunnel)
services:
  # Cơ sở dữ liệu PostgreSQL, dữ liệu lưu trong volume "pgdata" (không mất khi tắt máy / khởi động lại)
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: checklive
      POSTGRES_PASSWORD: checklive
      POSTGRES_DB: checklive
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checklive"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Checklive (server + giao diện web)
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://checklive:checklive@db:5432/checklive
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Cần đặt JWT_SECRET trong file .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@checklive.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Cần đặt ADMIN_PASSWORD trong file .env}
      EULER_API_KEY: ${EULER_API_KEY:-}
      FB_GRAPH_VERSION: ${FB_GRAPH_VERSION:-v26.0}
    ports:
      - "3000:3000"

  # Sao lưu tự động: 6 tiếng 1 lần vào thư mục ./backups, giữ 14 ngày gần nhất
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: checklive
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/checklive-$$(date +%Y%m%d-%H%M).dump
          pg_dump -h db -U checklive -Fc -f "$$f.tmp" checklive && mv "$$f.tmp" "$$f" && echo "Đã sao lưu $$f"
          find /backups -name 'checklive-*.dump' -mtime +14 -delete
          find /backups -name '*.tmp' -mmin +60 -delete
          sleep 21600
        done

  # Cloudflare Tunnel: đưa Checklive ra Internet bằng tên miền HTTPS, không cần mở cổng router.
  # Chỉ chạy khi bật profile "tunnel" và có TUNNEL_TOKEN trong .env.
  # Trên Cloudflare, đặt Public Hostname trỏ tới: http://app:3000
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

volumes:
  pgdata:
